[package]
name = "pdfcraft-ocr"
description = "Scan & OCR: recognise text in page images (ocrs) and write it as an invisible, searchable text layer"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
pdfcraft-fonts = { workspace = true }
ocrs = { version = "0.13.1", default-features = false, features = ["rten"] }
rten = { version = "0.26.0", default-features = false, features = ["onnx_format", "rten_format"] }
rten-imageproc = "0.26.0"
# Always: the PP-OCR recognisers (#2520) use it on the CPU.
rten-tensor = "0.26.0"
thiserror.workspace = true
log = { workspace = true, optional = true }

[features]
default = []
# Recognise text on the GPU (pdfcraft-ml) when PDFCRAFT_OCR_GPU=1 and the models are ONNX; the
# CPU path stays, as the fallback for any GPU error.
gpu = ["dep:pdfcraft-ml", "pdfcraft-ml/gpu", "dep:log"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pdfcraft-ml = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3.27"
